<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Boodschappenlijstje - Parelcouscous & Ovenschotel</title>
    <style>
        :root {
            --primary: #5c6bc0;
            --secondary: #e8eaf6;
            --dark: #333;
            --light: #fff;
        }
        body {
            font-family: sans-serif;
            margin: 0;
            padding: 20px;
            background-color: var(--secondary);
            color: var(--dark);
        }
        .container {
            max-width: 600px;
            margin: 0 auto;
            background: var(--light);
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        h1 {
            color: var(--primary);
            text-align: center;
            font-size: 1.5rem;
        }
        h2 {
            border-bottom: 2px solid var(--primary);
            padding-bottom: 5px;
            margin-top: 20px;
            color: var(--primary);
            font-size: 1.2rem;
        }
        ul {
            list-style-type: none;
            padding-left: 0;
        }
        li {
            margin-bottom: 12px;
            display: flex;
            align-items: center;
        }
        input[type="checkbox"] {
            margin-right: 12px;
            transform: scale(1.2);
            cursor: pointer;
        }
        label {
            cursor: pointer;
        }
        input[type="checkbox"]:checked + label {
            text-decoration: line-through;
            color: #888;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Boodschappenlijstje 🛒</h1>
        
        <h2>Ingrediënten</h2>
        <ul>
            <li>
                <input type="checkbox" id="item1">
                <label for="item1">Rijst</label>
            </li>
            <li>
                <input type="checkbox" id="item2">
                <label for="item2">Kipfilet <em>of</em> Zalm (kies er één)</label>
            </li>
            <li>
                <input type="checkbox" id="item3">
                <label for="item3">Courgette</label>
            </li>
            <li>
                <input type="checkbox" id="item4">
                <label for="item4">Doperwten</label>
            </li>
            <li>
                <input type="checkbox" id="item5">
                <label for="item5">Geraspte milde kaas (optioneel)</label>
            </li>
            <li>
                <input type="checkbox" id="item6">
                <label for="item6">Kruiden (paprikapoeder, zout)</label>
            </li>
            <li>
                <input type="checkbox" id="item7">
                <label for="item7">Olie</label>
            </li>
        </ul>
    </div>
</body>
</html>
